[package]
name = "rustis"
version = "0.1.0"
edition = "2024"
publish = false
description = "Disk-backed public transport routing prototype"

[dependencies]
anyhow = "1"
csv = "1.4"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
